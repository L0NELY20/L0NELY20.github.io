<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LONELY — Official Links</title>

  <meta
    name="description"
    content="Official links for LONELY"
  >

  <meta name="theme-color" content="#020503">

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >

  <style>
    :root {
      --green: #53fc18;
      --green-light: #a7ff84;
      --green-dark: #102b0c;

      --black: #010201;
      --black-soft: #040805;

      --white: #ffffff;

      --panel: rgba(4, 9, 5, 0.87);
      --border: rgba(83, 252, 24, 0.32);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(83, 252, 24, 0.18),
          transparent 36%
        ),
        radial-gradient(
          circle at 50% 110%,
          rgba(83, 252, 24, 0.12),
          transparent 35%
        ),
        linear-gradient(
          150deg,
          #010201 0%,
          #061007 48%,
          #010201 100%
        );
    }

    /* =========================
       الخلفية المتحركة
    ========================= */

    #particles {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 0;
      pointer-events: none;
    }

    .grid {
      position: fixed;
      inset: 0;

      z-index: 0;
      pointer-events: none;

      opacity: 0.22;

      background-image:
        linear-gradient(
          rgba(83, 252, 24, 0.045) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(83, 252, 24, 0.045) 1px,
          transparent 1px
        );

      background-size: 55px 55px;

      animation: moveGrid 18s linear infinite;

      mask-image:
        linear-gradient(
          to bottom,
          black,
          transparent 95%
        );
    }

    @keyframes moveGrid {
      to {
        background-position: 55px 55px;
      }
    }

    .green-glow {
      position: fixed;

      width: 560px;
      height: 560px;

      z-index: 0;
      pointer-events: none;

      border-radius: 50%;

      background: rgba(83, 252, 24, 0.11);

      filter: blur(125px);

      animation:
        floatGlow 11s ease-in-out infinite alternate;
    }

    .green-glow.one {
      top: -290px;
      left: -250px;
    }

    .green-glow.two {
      right: -270px;
      bottom: -300px;

      animation-delay: -5.5s;
    }

    @keyframes floatGlow {
      to {
        transform:
          translate(120px, 80px)
          scale(1.17);
      }
    }

    .rings {
      position: fixed;

      top: 51%;
      left: 50%;

      width: min(880px, 125vw);
      aspect-ratio: 1;

      z-index: 0;
      pointer-events: none;

      transform: translate(-50%, -50%);

      border:
        1px solid
        rgba(83, 252, 24, 0.08);

      border-radius: 50%;

      animation:
        rotateRings 40s linear infinite;
    }

    .rings::before,
    .rings::after {
      content: "";

      position: absolute;

      border-radius: 50%;
    }

    .rings::before {
      inset: 10%;

      border:
        1px dashed
        rgba(83, 252, 24, 0.10);

      animation:
        rotateRingsReverse 25s linear infinite;
    }

    .rings::after {
      inset: 23%;

      border:
        1px solid
        rgba(255, 255, 255, 0.035);
    }

    @keyframes rotateRings {
      to {
        transform:
          translate(-50%, -50%)
          rotate(360deg);
      }
    }

    @keyframes rotateRingsReverse {
      to {
        transform: rotate(-360deg);
      }
    }

    /* =========================
       الخيال الأبيض حول الماوس
    ========================= */

    .cursor-glow {
      position: fixed;

      top: 0;
      left: 0;

      width: 320px;
      height: 320px;

      z-index: 1;
      pointer-events: none;

      border-radius: 50%;

      opacity: 0;

      transform:
        translate(-50%, -50%);

      background:
        radial-gradient(
          circle,
          rgba(255, 255, 255, 0.13) 0%,
          rgba(255, 255, 255, 0.055) 25%,
          rgba(83, 252, 24, 0.025) 48%,
          transparent 70%
        );

      filter: blur(12px);

      transition:
        opacity 0.25s ease;
    }

    body:hover .cursor-glow {
      opacity: 1;
    }

    /* =========================
       شاشة البداية
    ========================= */

    .intro {
      position: fixed;
      inset: 0;

      z-index: 9999;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle,
          rgba(83, 252, 24, 0.15),
          transparent 34%
        ),
        #010201;

      animation:
        closeIntro 0.75s ease 1.8s forwards;
    }

    .intro-title {
      font-size:
        clamp(2.7rem, 10vw, 5.8rem);

      font-weight: 950;

      letter-spacing: 0.28em;
      margin-left: 0.28em;

      text-shadow:
        0 0 18px rgba(83, 252, 24, 0.45),
        0 0 60px rgba(83, 252, 24, 0.17);

      animation:
        showIntroTitle 1s ease both;
    }

    .intro-line {
      width: 0;
      height: 2px;

      margin-top: 23px;

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--green),
          white,
          var(--green),
          transparent
        );

      box-shadow:
        0 0 18px var(--green);

      animation:
        showIntroLine 1.1s ease 0.25s forwards;
    }

    .intro-text {
      margin-top: 18px;
      margin-left: 0.45em;

      color: var(--green-light);

      font-size: 0.68rem;
      font-weight: 800;

      letter-spacing: 0.45em;

      animation:
        showIntroText 0.8s ease 0.55s both;
    }

    @keyframes showIntroTitle {
      from {
        opacity: 0;

        filter: blur(12px);

        transform:
          translateY(20px)
          scale(0.95);
      }

      to {
        opacity: 1;

        filter: blur(0);

        transform:
          translateY(0)
          scale(1);
      }
    }

    @keyframes showIntroLine {
      to {
        width: min(390px, 76vw);
      }
    }

    @keyframes showIntroText {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes closeIntro {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    /* =========================
       الصفحة
    ========================= */

    .page {
      position: relative;
      z-index: 3;

      width: min(92%, 570px);
      min-height: 100vh;

      margin: auto;
      padding: 58px 0 30px;

      display: flex;
      flex-direction: column;
      align-items: center;

      opacity: 0;

      animation:
        showPage 0.8s ease 1.95s forwards;
    }

    @keyframes showPage {
      to {
        opacity: 1;
      }
    }

    /* =========================
       الاسم
    ========================= */

    .brand {
      width: 100%;

      margin-bottom: 38px;

      text-align: center;
    }

    .brand-name {
      position: relative;

      font-size:
        clamp(2.8rem, 11vw, 4.7rem);

      line-height: 1;

      font-weight: 950;

      letter-spacing: 0.24em;
      margin-left: 0.24em;

      text-shadow:
        0 0 18px rgba(83, 252, 24, 0.33),
        0 0 50px rgba(83, 252, 24, 0.13);
    }

    .brand-name::after {
      content: "";

      position: absolute;

      left: 8%;
      right: 8%;
      bottom: -18px;

      height: 2px;

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--green),
          white,
          var(--green),
          transparent
        );

      box-shadow:
        0 0 18px
        rgba(83, 252, 24, 0.75);
    }

    .tagline {
      margin-top: 36px;
      margin-left: 0.47em;

      color: var(--green-light);

      font-size: 0.69rem;
      font-weight: 850;

      letter-spacing: 0.47em;
    }

    /* =========================
       الأزرار
    ========================= */

    .links {
      width: 100%;

      display: grid;
      gap: 14px;
    }

    .link {
      --platform: white;

      position: relative;

      width: 100%;
      min-height: 82px;

      padding: 0 20px;

      display: grid;
      grid-template-columns: 54px 1fr 34px;
      align-items: center;
      gap: 18px;

      overflow: hidden;

      color: white;
      text-decoration: none;

      border:
        1px solid
        rgba(83, 252, 24, 0.30);

      border-radius: 18px;

      background:
        linear-gradient(
          115deg,
          rgba(83, 252, 24, 0.065),
          transparent 40%
        ),
        var(--panel);

      backdrop-filter: blur(18px);

      box-shadow:
        inset 0 1px 0
        rgba(255, 255, 255, 0.07),

        inset 0 0 28px
        rgba(83, 252, 24, 0.025),

        0 16px 40px
        rgba(0, 0, 0, 0.40);

      transition:
        transform 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease;

      animation:
        enterButton 0.62s ease both;
    }

    .link:nth-child(1) {
      animation-delay: 2.10s;
    }

    .link:nth-child(2) {
      animation-delay: 2.20s;
    }

    .link:nth-child(3) {
      animation-delay: 2.30s;
    }

    .link:nth-child(4) {
      animation-delay: 2.40s;
    }

    .link:nth-child(5) {
      animation-delay: 2.50s;
    }

    .link:nth-child(6) {
      animation-delay: 2.60s;
    }

    .link:nth-child(7) {
      animation-delay: 2.70s;
    }

    @keyframes enterButton {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .link::before {
      content: "";

      position: absolute;
      inset: 0;

      opacity: 0;

      background:
        radial-gradient(
          circle at
          var(--mouse-x, 50%)
          var(--mouse-y, 50%),

          rgba(255, 255, 255, 0.15),
          rgba(83, 252, 24, 0.06) 22%,
          transparent 48%
        );

      transition:
        opacity 0.25s ease;
    }

    .link::after {
      content: "";

      position: absolute;

      top: -95%;
      left: -150px;

      width: 90px;
      height: 290%;

      transform: rotate(24deg);

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.20),
          transparent
        );

      transition:
        left 0.65s ease;
    }

    .link:hover {
      transform:
        translateY(-4px)
        scale(1.012);

      border-color:
        rgba(83, 252, 24, 0.72);

      box-shadow:
        inset 0 1px 0
        rgba(255, 255, 255, 0.12),

        0 20px 48px
        rgba(0, 0, 0, 0.48),

        0 0 30px
        rgba(83, 252, 24, 0.12);
    }

    .link:hover::before {
      opacity: 1;
    }

    .link:hover::after {
      left: 120%;
    }

    /* =========================
       صندوق الأيقونة
    ========================= */

    .icon-box {
      position: relative;
      z-index: 2;

      width: 50px;
      height: 50px;

      display: grid;
      place-items: center;

      border-radius: 14px;

      border:
        1px solid
        rgba(255, 255, 255, 0.35);

      background:
        rgba(1, 5, 2, 0.72);

      box-shadow:
        inset 0 0 18px
        rgba(83, 252, 24, 0.05),

        0 8px 18px
        rgba(0, 0, 0, 0.28);

      font-size: 1.55rem;
    }

    .link-title {
      position: relative;
      z-index: 2;

      text-align: center;

      font-size: 1.06rem;
      font-weight: 950;

      letter-spacing: 0.06em;

      color: var(--platform);
    }

    .arrow {
      position: relative;
      z-index: 2;

      color: var(--green);

      font-size: 1.45rem;
      font-weight: 900;

      text-align: right;

      text-shadow:
        0 0 14px var(--green);

      transition:
        transform 0.3s ease;
    }

    .link:hover .arrow {
      transform: translateX(6px);
    }

    /* =========================
       Kick
    ========================= */

    .kick {
      --platform: #53fc18;
    }

    .kick-logo {
      width: 31px;
      height: 31px;

      object-fit: contain;

      image-rendering: auto;

      filter:
        drop-shadow(
          0 0 8px
          rgba(83, 252, 24, 0.45)
        );
    }

    /* =========================
       ألوان التطبيقات
    ========================= */

    .x-link {
      --platform: #ffffff;
    }

    .x-link .icon-box {
      color: #ffffff;
    }

    .paypal {
      --platform: #24a8ea;
    }

    .paypal .icon-box {
      color: #24a8ea;
    }

    .youtube {
      --platform: #ff4c62;
    }

    .youtube .icon-box {
      color: #ff4c62;
    }

    /* Instagram Gradient */
    .instagram .link-title,
    .instagram .icon-box i {
      background:
        linear-gradient(
          90deg,
          #ffd36b 0%,
          #ff6c6c 28%,
          #ff4fc3 53%,
          #975cff 76%,
          #53a9ff 100%
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }

    .instagram .icon-box i {
      filter:
        drop-shadow(
          0 0 8px
          rgba(255, 87, 185, 0.25)
        );
    }

    /* TikTok أبيض */
    .tiktok {
      --platform: #ffffff;
    }

    .tiktok .icon-box {
      color: #ffffff;

      text-shadow:
        2px 2px 0 rgba(255, 0, 80, 0.45),
        -2px -2px 0 rgba(0, 235, 255, 0.35);
    }

    .discord {
      --platform: #7d8cff;
    }

    .discord .icon-box {
      color: #7d8cff;
    }

    /* =========================
       LIVE NOW
    ========================= */

    .live-status {
      position: absolute;

      right: 55px;
      bottom: 13px;

      z-index: 3;

      display: none;
      align-items: center;
      gap: 6px;

      color: var(--green-light);

      font-size: 0.58rem;
      font-weight: 900;

      letter-spacing: 0.08em;
    }

    .live-status.show {
      display: flex;
    }

    .live-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--green);

      box-shadow:
        0 0 12px var(--green);

      animation:
        pulseLive 1.3s ease-in-out infinite;
    }

    @keyframes pulseLive {
      50% {
        opacity: 0.35;
        transform: scale(0.75);
      }
    }

    /* =========================
       Footer
    ========================= */

    footer {
      margin-top: auto;

      padding-top: 48px;

      color: #7b867d;

      text-align: center;

      font-size: 0.61rem;

      letter-spacing: 0.22em;
    }

    footer strong {
      color: var(--green);
    }

    /* =========================
       الموبايل
    ========================= */

    @media (max-width: 520px) {
      .page {
        padding-top: 45px;
      }

      .brand-name {
        font-size: 2.55rem;
      }

      .tagline {
        font-size: 0.60rem;
      }

      .link {
        min-height: 74px;

        padding: 0 15px;

        grid-template-columns:
          46px 1fr 28px;

        gap: 13px;
      }

      .icon-box {
        width: 44px;
        height: 44px;

        font-size: 1.3rem;
      }

      .kick-logo {
        width: 28px;
        height: 28px;
      }

      .link-title {
        font-size: 0.96rem;
      }

      .arrow {
        font-size: 1.25rem;
      }

      .cursor-glow {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
        transition-duration: 0.01ms !important;
      }

      .intro {
        display: none;
      }

      .page {
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <script>
    /*
      حالة البث:

      false = إخفاء LIVE NOW
      true = إظهار LIVE NOW
    */

    const isLive = false;

    const liveStatus =
      document.getElementById("liveStatus");

    if (isLive) {
      liveStatus.classList.add("show");
    }

    /*
      الروابط التي لم تتم إضافتها
    */

    function comingSoon() {
      alert("This link will be added soon.");
      return false;
    }

    /*
      الخيال الأبيض الذي يتبع الماوس
    */

    const cursorGlow =
      document.getElementById("cursorGlow");

    let mouseX =
      window.innerWidth / 2;

    let mouseY =
      window.innerHeight / 2;

    let glowX = mouseX;
    let glowY = mouseY;

    document.addEventListener(
      "mousemove",
      (event) => {
        mouseX = event.clientX;
        mouseY = event.clientY;
      }
    );

    function animateCursorGlow() {
      glowX +=
        (mouseX - glowX) * 0.12;

      glowY +=
        (mouseY - glowY) * 0.12;

      cursorGlow.style.left =
        `${glowX}px`;

      cursorGlow.style.top =
        `${glowY}px`;

      requestAnimationFrame(
        animateCursorGlow
      );
    }

    animateCursorGlow();

    /*
      الإضاءة داخل كل زر
    */

    document
      .querySelectorAll(".link")
      .forEach((link) => {

        link.addEventListener(
          "mousemove",
          (event) => {

            const rect =
              link.getBoundingClientRect();

            const x =
              event.clientX - rect.left;

            const y =
              event.clientY - rect.top;

            link.style.setProperty(
              "--mouse-x",
              `${x}px`
            );

            link.style.setProperty(
              "--mouse-y",
              `${y}px`
            );

          }
        );

      });

    /*
      الجزيئات المتحركة
    */

    const canvas =
      document.getElementById("particles");

    const ctx =
      canvas.getContext("2d");

    let particles = [];
    let animationFrame;

    function resizeCanvas() {
      const ratio =
        window.devicePixelRatio || 1;

      canvas.width =
        window.innerWidth * ratio;

      canvas.height =
        window.innerHeight * ratio;

      canvas.style.width =
        `${window.innerWidth}px`;

      canvas.style.height =
        `${window.innerHeight}px`;

      ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
      );

      createParticles();
    }

    function createParticles() {
      const amount =
        Math.min(
          115,
          Math.floor(
            (
              window.innerWidth *
              window.innerHeight
            ) / 11000
          )
        );

      particles =
        Array.from(
          { length: amount },
          (_, index) => ({
            x:
              Math.random() *
              window.innerWidth,

            y:
              Math.random() *
              window.innerHeight,

            radius:
              Math.random() * 1.8 + 0.35,

            speedX:
              (Math.random() - 0.5) * 0.28,

            speedY:
              Math.random() * -0.38 - 0.06,

            alpha:
              Math.random() * 0.60 + 0.15,

            colour:
              index % 8 === 0
                ? "255, 255, 255"
                : "83, 252, 24"
          })
        );
    }

    function animateParticles() {
      ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
      );

      particles.forEach(
        (particle) => {

          particle.x +=
            particle.speedX;

          particle.y +=
            particle.speedY;

          if (particle.y < -10) {
            particle.y =
              window.innerHeight + 10;

            particle.x =
              Math.random() *
              window.innerWidth;
          }

          if (particle.x < -10) {
            particle.x =
              window.innerWidth + 10;
          }

          if (
            particle.x >
            window.innerWidth + 10
          ) {
            particle.x = -10;
          }

          ctx.beginPath();

          ctx.arc(
            particle.x,
            particle.y,
            particle.radius,
            0,
            Math.PI * 2
          );

          ctx.fillStyle =
            `rgba(
              ${particle.colour},
              ${particle.alpha}
            )`;

          ctx.shadowBlur = 12;

          ctx.shadowColor =
            `rgba(
              ${particle.colour},
              ${particle.alpha}
            )`;

          ctx.fill();
        }
      );

      animationFrame =
        requestAnimationFrame(
          animateParticles
        );
    }

    window.addEventListener(
      "resize",
      () => {
        cancelAnimationFrame(
          animationFrame
        );

        resizeCanvas();
        animateParticles();
      }
    );

    resizeCanvas();
    animateParticles();
  </script>

</body>
</html>
